
services:
  # Servicio 1: Base de datos MongoDB
  mongo:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017" # Para que también puedas conectarte desde Robo3T, Compass o DBeaver si lo deseas
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: elportu123
    volumes:
      - mongo_data:/data/db # Mantiene tus datos guardados aunque el contenedor se apague



# Volúmenes para persistir la información de MongoDB
volumes:
  mongo_data:
